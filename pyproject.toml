[project]
name = "nonebot-plugin-aichat-deepseek"
version = "0.14.2"
description = "基于 DeepSeek API 的 NoneBot2 私聊对话插件"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "zmy15", email = "109537161+zmy15@users.noreply.github.com" }]
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "httpx>=0.28.1",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "nonebug>=0.4",
]

[project.urls]
Homepage = "https://github.com/zmy15/nonebot-plugin-aichat-deepseek"
Repository = "https://github.com/zmy15/nonebot-plugin-aichat-deepseek"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_aichat_deepseek"]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
